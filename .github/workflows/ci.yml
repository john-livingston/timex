name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor: celerite2 builds against jax==0.8.0, which needs
        # >=3.11. The two legs also straddle a dependency boundary, since 3.11
        # resolves to jax 0.10.x while 3.12 gets 0.11+. Development happens on
        # 3.13, which shares 3.12's jax line.
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # celerite2 and limbdark are not installable from PyPI for this project.
      # The published celerite2 0.3.2 cannot import under JAX 0.6 and later, and
      # limbdark is not on PyPI at all, so both come from git exactly as
      # docs/installation.md instructs. celerite2 builds C++ against a vendored
      # Eigen submodule, which pip fetches for VCS installs, so this step
      # compiles and is the slow part of the leg.
      - name: Install git only dependencies
        run: |
          pip install "git+https://github.com/exoplanet-dev/celerite2"
          pip install "git+https://github.com/john-livingston/limbdark"

      - run: pip install -e '.[test]'

      # the full suite, including the slow tests that run real fits. Those are
      # the ones that catch resume and GP path regressions, so they are worth
      # the few minutes.
      - run: pytest -q

  docs:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # the site uses no mkdocstrings and no plugins, so it never imports timex.
      # Installing only the documentation toolchain skips the celerite2 compile
      # that the test job pays for. Keep this list in step with the docs extra
      # in pyproject.toml, which exists for building the site locally.
      - name: Install documentation toolchain
        run: pip install mkdocs mkdocs-material pymdown-extensions

      - name: Build the site strictly
        run: mkdocs build --strict

      - name: Deploy to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
